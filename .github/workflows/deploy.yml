name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - my-portfolio_DEV

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Build Angular app
      - name: Build Angular App
        run: npm run build -- --configuration production --base-href "/my-portfolio/"

      # 5. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages                  # deploy branch
          folder: dist/demo/browser       # build output folder
          clean: true                        # ⚡ ensures temp folder is cleared
          token: ${{ secrets.GITHUB_TOKEN }} # uses GitHub Actions token